<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gen AI Research Labs | Contact Us</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>
  <div class="split-container">
    <!-- Left Side: Contact Form -->
    <div class="left-pane">
      <button class="go-back" onclick="window.history.back();">← Go Back</button>
      <h1>Gen AI Research Labs</h1>
      <h2>Contact Us</h2>
      <form action="https://formspree.io/f/myzebqvl" method="POST" class="contact-form">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <textarea name="message" placeholder="Your Message" rows="6" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>

    <!-- Right Side: Contact Info -->
    <div class="right-pane">
      <div class="contact-info">
        <h3>Dr.Sabarinath Subramaniam</h3>
        <p>Director, Sivasakthi Science Foundation</p>
        <div class="links">
          <a href="https://www.sivasakthifoundation.org" target="_blank">www.sivasakthifoundation.org</a>
          <a href="https://www.bgdb.org" target="_blank">www.bgdb.org</a>
          <a href="https://www.genairesearch.org" target="_blank">www.genairesearch.org</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
